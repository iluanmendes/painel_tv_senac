<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar Robô Sumô - Casa Aberta Senac</title>



    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animacoes.css">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body class="tela-tv">
    <div class="overlay-textura"></div>

    <header class="cabecalho-senac">
        <img src="logo-casa-aberta.png" alt="logo casa aberta senac">
        <h2 id="titulo-modo" class="badge-modo">
            Aguardando Início...
        </h2>        
    </header>

    <main class="arena">
        <!-- MODO TORNEIO -->
        <section id="modo-torneio" class="oculto layout-torneio">
            <div class="competidor card-azul">
                <img src="personagem-robo1.png" alt="" class="personagem personagem-esquerda">

                <h2 id="nome-robo1">Robô 1</h2>
                <div class="bexigas" id="bexigas-robo1">0</div>
            </div>

            <div class="centro-placar">
                <h3 class="label-tempo">TEMPO</h3>
                <div class="cronometro" id="cronometro-torneio">03:00</div>
                <h2 id="vencedor-torneio" class="mensagem-vencedor"></h2>
            </div>

            <div class="competidor card-vermelho">
                <img src="personagem-robo2.png" alt="" class="personagem personagem-direita">

                <h2 id="nome-robo2">Robô 2</h2>
                <div class="bexigas" id="bexigas-robo2">0</div>
            </div>
        </section>

        <!-- MODO FREESTYLE -->
        <section id="modo-freestyle" class="oculto">

            <div class="layout-torneio">
                <div class="competidor card-azul">
                    <img src="personagem-robo1.png" alt="" class="personagem personagem-esquerda">
                    <h2 id="nome-free-robo1">Robô 1</h2>
                    <div class="selo-freestyle" id="selo-free-robo1"></div>
                </div>

                <div class="centro-placar">
                    <h3 class="label-tempo">TEMPO FREESTYLE</h3>
                    <div class="cronometro" id="cronometro-freestyle">00:00</div>
                    <h2 id="vencedor-freestyle" class="mensagem-vencedor"></h2>
                </div>

                <div class="competidor card-vermelho">
                    <img src="personagem-robo2.png" alt="" class="personagem personagem-direita">
                    <h2 id="nome-free-robo2">Robô 2</h2>
                    <div class="selo-freestyle" id="selo-free-robo2"></div>
                </div>
            </div>

            <div class="historico">
                <h3 class="titulo-ranking">RANKING FREESTYLE</h3>
                <ul id="lista-freestyle"></ul>
            </div>
        </section>





    </main>

    <script src="tela.js?v=3"></script>
    <script src="animacoes.js"></script>
</body>

</html>
