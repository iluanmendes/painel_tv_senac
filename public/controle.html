<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle - Robô Sumô</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body class="tela-controle">

    <header class="cabecalho-controle">
        <img src="logo-casa-aberta.png" alt="Casa Aberta Senac">
        <h1>Painel de Controle</h1>
        <button id="btn-abrir-config" class="botao-engrenagem" title="Configurações" aria-label="Abrir configurações">
            ⚙️
        </button>
    </header>

    <div id="status-conexao" class="status-conexao status-offline">
        <span class="ponto"></span> Conectando...
    </div>


    <!-- TELA DE BLOQUEIO -->
    <div id="tela-bloqueio" class="tela-login">
        <div class="card-login">
            <h2>🔒 Painel de Controle</h2>
            <p>Digite a senha para acessar</p>
            <input type="password" id="input-senha" placeholder="Senha" autocomplete="off">
            <button id="btn-entrar" class="btn-primario">Entrar</button>
            <p id="msg-erro-login" class="msg-erro oculto"></p>
        </div>
    </div>

    <!-- PAINEL DE CONTROLE -->
    <div id="conteudo-controle" class="oculto">

        <div class="card-controle">
            <label>Menu:</label>
            <div class="botoes-modo" style="display: flex; gap: 5px;">
                <button id="btn-modo-torneio" class="btn-primario">Torneio</button>
                <button id="btn-modo-freestyle" class="btn-primario">Freestyle</button>
            </div>

            <button id="btn-resetar-competicao" class="btn-reset">
                🔄 Zerar Partida / Voltar ao Início
            </button>

        </div>

        <!-- MODO DE CONFIGURAÇÃO -->
        <div id="controles-config" class="card-controle oculto">
            <div class="cabecalho-config">
                <h3>Configurações do Campeonato</h3>
                <button id="btn-fechar-config" class="botao-fechar" aria-label="Fechar configurações">✕</button>
            </div>

            <label>Tempo do Torneio (em segundos):</label>
            <input type="number" id="input-tempo-torneio" placeholder="Ex: 180" min="10">
            <button id="btn-salvar-config" class="btn-sucesso">Salvar Configurações</button>
        </div>

        <!-- =====================================================
     CONTROLES TORNEIO
===================================================== -->

        <div id="controles-torneio" class="card-controle oculto">

            <h3>Modo Torneio</h3>

            <input type="text" id="input-robo1" placeholder="Nome do Robô Azul" maxlength="24">

            <input type="text" id="input-robo2" placeholder="Nome do Robô Vermelho" maxlength="24">


            <!-- ===============================
         PREPARAÇÃO
    ================================ -->

            <div id="acoes-preparo-torneio" class="acoes">

                <button id="btn-preparar-torneio" class="btn-sucesso">
                    Preparar Partida
                </button>

            </div>


            <!-- ===============================
         PARTIDA
    ================================ -->

            <div id="acoes-jogo-torneio" class="oculto">

                <!-- CONTROLE PRINCIPAL -->

                <button id="btn-iniciar-tempo-torneio" class="btn-sucesso btn-iniciar-partida">
                    ▶️ Iniciar Partida
                </button>


                <button id="btn-pausar-tempo-torneio" class="btn-alerta oculto">
                    ⏸️ Pausar Partida
                </button>


                <!-- ===========================
             PONTUAÇÃO
        ============================ -->

                <div class="acoes-pontuacao">

                    <!-- AZUL -->

                    <div class="grupo-pontuacao">

                        <button id="btn-ponto-robo1" class="btn-azul">
                            + Ponto Azul
                        </button>

                        <button id="btn-desfazer-robo1" class="btn-corrigir" title="Retirar último ponto do azul"
                            aria-label="Retirar último ponto do azul">
                            ↩ Corrigir
                        </button>

                    </div>


                    <!-- VERMELHO -->

                    <div class="grupo-pontuacao">

                        <button id="btn-ponto-robo2" class="btn-vermelho">
                            + Ponto Vermelho
                        </button>

                        <button id="btn-desfazer-robo2" class="btn-corrigir" title="Retirar último ponto do vermelho"
                            aria-label="Retirar último ponto do vermelho">
                            ↩ Corrigir
                        </button>

                    </div>

                </div>


                <!-- ===========================
             CANCELAR
        ============================ -->

                <button id="btn-cancelar-torneio" class="btn-primario btn-cancelar">
                    Cancelar Partida
                </button>

            </div>

        </div>


        <!-- =====================================================
     CONTROLES FREESTYLE
===================================================== -->

        <div id="controles-freestyle" class="card-controle oculto">

            <h3>Modo Freestyle</h3>

            <p class="descricao-controle">
                Cada robô possui uma tentativa.
            </p>


            <!-- ===============================
         PARTICIPANTES
    ================================ -->

            <input type="text" id="input-free-robo1" placeholder="Nome do Robô Azul" maxlength="24">

            <input type="text" id="input-free-robo2" placeholder="Nome do Robô Vermelho" maxlength="24">


            <!-- ===============================
         PREPARAÇÃO
    ================================ -->

            <div id="acoes-preparo-freestyle" class="acoes">

                <button id="btn-preparar-freestyle" class="btn-sucesso">
                    Preparar Partida
                </button>

            </div>


            <!-- ===============================
         PARTIDA
    ================================ -->

            <div id="acoes-jogo-freestyle" class="oculto">

                <button id="btn-iniciar-freestyle" class="btn-sucesso btn-iniciar-partida">
                    ▶️ Iniciar Partida
                </button>

                <button id="btn-cancelar-preparo-freestyle" class="btn-primario btn-cancelar">
                    Cancelar
                </button>

                <!-- VENCEDOR -->
                <div id="acoes-vencedor-freestyle" class="acoes-pontuacao oculto">
                    <button id="btn-venceu-robo1" class="btn-azul">🏆 Vitória Azul</button>
                    <button id="btn-venceu-robo2" class="btn-vermelho">🏆 Vitória Vermelha</button>
                    <button id="btn-empate-freestyle" class="btn-alerta">🤝 Sem Vencedor</button>
                    <button id="btn-cancelar-freestyle" class="btn-primario btn-cancelar">Cancelar Partida</button>
                </div>
            </div>

        </div>


    </div>
    <script src="controle.js"></script>
</body>

</html>
